<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CUDA RMSNorm FP32 Optimization — Agent Tracing</title>
<style>
  :root {
    --bg: #0b101b;
    --bg-grid: rgba(148, 163, 184, 0.16);
    --surface: #131b2e;
    --surface-2: #1b253d;
    --surface-glass: rgba(19, 27, 46, 0.84);
    --border: rgba(148, 163, 184, 0.18);
    --border-strong: rgba(148, 163, 184, 0.34);
    --text: #e2e8f0;
    --text-bright: #f8fafc;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --accent-glow: rgba(59, 130, 246, 0.35);
    --pass: #10b981;
    --fail: #ef4444;
    --warn: #f59e0b;
    --purple: #a78bfa;
    --radius: 11px;
    --shadow: 0 8px 24px rgba(2, 6, 23, 0.45);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; flex-direction: column; overflow: hidden; }
  body.resizing-drawer { cursor: col-resize !important; user-select: none !important; }
  body.panning-canvas { cursor: grabbing !important; user-select: none !important; }

  /* Header */
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 9px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
    flex-shrink: 0; flex-wrap: wrap; z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .brand h1 { margin: 0; font-size: 14.5px; font-weight: 700; color: var(--text-bright); letter-spacing: 0.01em; }
  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
    background: var(--surface-2); color: var(--muted); border: 1px solid var(--border);
  }
  .pill.best {
    background: rgba(245, 158, 11, 0.16); color: #fbbf24;
    border-color: rgba(245, 158, 11, 0.45);
    box-shadow: 0 0 12px rgba(245, 158, 11, 0.18);
  }
  .toolbar { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  button, select {
    font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    cursor: pointer; transition: all 0.14s ease;
  }
  button:hover, select:hover { border-color: var(--border-strong); background: #23304f; color: var(--text-bright); }
  button.active {
    background: rgba(59, 130, 246, 0.2); color: #93c5fd;
    border-color: rgba(59, 130, 246, 0.65);
    box-shadow: 0 0 12px rgba(59, 130, 246, 0.22);
  }
  .tabs { display: inline-flex; background: #0d1424; padding: 2px; border-radius: 8px; border: 1px solid var(--border); }
  .tabs button { border: none; background: transparent; padding: 4px 12px; border-radius: 6px; color: var(--muted); box-shadow: none; }
  .tabs button.active { background: var(--surface-2); color: var(--text-bright); font-weight: 600; }

  /* Main layout */
  .main { display: flex; flex: 1; min-height: 0; position: relative; }
  .viewport {
    flex: 1; min-width: 240px; position: relative; overflow: hidden;
    cursor: grab;
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.08), transparent 55%),
      radial-gradient(var(--bg-grid) 1.1px, transparent 1.1px);
    background-size: 100% 100%, 24px 24px;
  }
  .viewport.dragging { cursor: grabbing; }
  .canvas-stage { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
  svg.edges-layer { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
  svg.edges-layer path.edge-hit { pointer-events: stroke; cursor: pointer; }
  svg.edges-layer path.edge-line { pointer-events: none; transition: opacity 0.16s, stroke-width 0.16s, filter 0.16s; stroke-linecap: round; stroke-linejoin: round; }
  svg.edges-layer g.edge-group:hover path.edge-line { stroke-width: 3.2px; filter: drop-shadow(0 0 7px currentColor); }
  svg.edges-layer .edge-pill-bg { fill: #0d1424; stroke-width: 1px; pointer-events: none; }
  svg.edges-layer .edge-label {
    font-size: 10.5px; fill: #e2e8f0; font-weight: 600;
    pointer-events: none; dominant-baseline: central;
  }

  /* Edge Hover Tooltip */
  .edge-tooltip {
    position: fixed; z-index: 60; pointer-events: none; max-width: 340px;
    background: rgba(15, 23, 42, 0.96); color: var(--text-bright);
    border: 1px solid var(--border-strong); border-radius: 8px;
    padding: 7px 10px; font-size: 11.5px; line-height: 1.45;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.55); backdrop-filter: blur(8px);
    display: none;
  }
  .edge-tooltip .et-head { font-weight: 700; margin-bottom: 2px; color: #93c5fd; }

  /* Attempt Node Cards (Shader/Studio Node Style) */
  .node-card {
    position: absolute; width: 256px;
    background: linear-gradient(180deg, #172138 0%, #121a2d 100%);
    border: 1.5px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    padding: 10px 12px 0 12px;
    cursor: pointer; user-select: none; overflow: visible;
    transition: box-shadow 0.15s ease, opacity 0.16s ease, border-color 0.15s ease, transform 0.12s ease;
  }
  .node-card:hover {
    border-color: rgba(148, 163, 184, 0.45);
    box-shadow: 0 12px 28px rgba(2, 6, 23, 0.6), 0 0 18px rgba(59, 130, 246, 0.16);
    z-index: 4;
  }
  .node-card.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5), 0 0 26px var(--accent-glow), var(--shadow);
    z-index: 6;
  }
  .node-card.dimmed { opacity: 0.2; }
  .node-card.best-node {
    border-color: rgba(245, 158, 11, 0.75);
    box-shadow: 0 0 22px rgba(245, 158, 11, 0.2), var(--shadow);
  }
  .node-card.best-node.selected {
    border-color: #fbbf24;
    box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.55), 0 0 28px rgba(245, 158, 11, 0.35), var(--shadow);
  }
  /* Port Sockets */
  .node-port {
    position: absolute; width: 8px; height: 8px; border-radius: 50%;
    background: #1e293b; border: 1.5px solid #64748b; pointer-events: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .node-card.selected .node-port { border-color: #60a5fa; background: #1d4ed8; }
  .node-port.port-in-tb { top: -5px; left: 50%; transform: translateX(-50%); }
  .node-port.port-out-tb { bottom: -5px; left: 50%; transform: translateX(-50%); }
  .node-port.port-in-lr { left: -5px; top: 50%; transform: translateY(-50%); }
  .node-port.port-out-lr { right: -5px; top: 50%; transform: translateY(-50%); }

  .node-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 5px; }
  .node-id { font-weight: 700; font-size: 12px; color: #93c5fd; display: flex; align-items: center; gap: 4px; }
  .node-card.best-node .node-id { color: #fbbf24; }
  .status-badge {
    font-size: 10px; font-weight: 700; padding: 1.5px 7px; border-radius: 999px; text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .st-passed, .st-improved { background: rgba(16, 185, 129, 0.18); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.35); }
  .st-failed, .st-fail, .st-error { background: rgba(239, 68, 68, 0.18); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.35); }
  .st-abandoned, .st-regressed { background: rgba(245, 158, 11, 0.16); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.35); }
  .st-running { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
  .st-ok, .st-info, .st-neutral { background: rgba(148, 163, 184, 0.16); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.3); }

  .node-title { font-weight: 600; font-size: 13px; line-height: 1.38; margin-bottom: 7px; word-break: break-word; color: var(--text-bright); }
  .metric-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .metric-chip {
    font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: rgba(15, 23, 42, 0.72); border: 1px solid rgba(148, 163, 184, 0.16);
    padding: 1.5px 6px; border-radius: 5px; color: #cbd5e1;
  }
  .node-foot {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; color: var(--muted); padding-bottom: 8px;
  }
  .phase-strip {
    display: flex; height: 4px; margin: 0 -12px;
    background: rgba(15, 23, 42, 0.8);
    border-radius: 0 0 calc(var(--radius) - 1.5px) calc(var(--radius) - 1.5px);
    overflow: hidden;
  }
  .phase-seg { height: 100%; }

  /* Floating Legend & Zoom HUD */
  .legend {
    position: absolute; bottom: 14px; left: 14px; background: var(--surface-glass);
    border: 1px solid var(--border); border-radius: 9px; padding: 7px 12px;
    display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--muted);
    box-shadow: var(--shadow); backdrop-filter: blur(10px); z-index: 10;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-line { width: 16px; height: 2px; display: inline-block; border-radius: 1px; }
  .legend-line.dashed { border-top: 2px dashed #94a3b8; background: none; height: 0; }

  .zoom-hud {
    position: absolute; bottom: 14px; right: 14px; z-index: 10;
    display: inline-flex; align-items: center; gap: 2px;
    background: var(--surface-glass); border: 1px solid var(--border);
    border-radius: 9px; padding: 3px; box-shadow: var(--shadow); backdrop-filter: blur(10px);
  }
  .zoom-hud button {
    border: none; background: transparent; padding: 4px 8px; border-radius: 6px;
    font-size: 12px; font-weight: 600; color: var(--text); min-width: 28px;
  }
  .zoom-hud button:hover { background: rgba(148, 163, 184, 0.16); }
  .zoom-hud .zoom-pct { font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted); min-width: 46px; text-align: center; }

  /* Resizable Splitter Handle */
  .drawer-resizer {
    width: 6px; cursor: col-resize; flex-shrink: 0; position: relative; z-index: 15;
    background: transparent; transition: background 0.15s;
  }
  .drawer-resizer::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: 2px; width: 2px;
    background: var(--border); transition: background 0.15s, box-shadow 0.15s;
  }
  .drawer-resizer:hover::after, body.resizing-drawer .drawer-resizer::after {
    background: var(--accent); box-shadow: 0 0 10px var(--accent-glow);
  }
  .drawer-resizer.hidden { display: none; }

  /* Detail Drawer */
  .drawer {
    width: 480px; min-width: 300px; max-width: 78vw;
    background: var(--surface);
    display: flex; flex-direction: column; min-height: 0;
    box-shadow: -8px 0 28px rgba(2, 6, 23, 0.45);
    flex-shrink: 0; z-index: 12;
  }
  .drawer.hidden { display: none; }
  .drawer-head {
    padding: 13px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  }
  .drawer-head h2 { margin: 0 0 4px 0; font-size: 15px; color: var(--text-bright); }
  .drawer-tabs {
    display: flex; gap: 4px; padding: 8px 16px; border-bottom: 1px solid var(--border);
    background: #0f1627; flex-shrink: 0; flex-wrap: wrap;
  }
  .drawer-tabs button { font-size: 11px; padding: 4px 10px; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .section { border: 1px solid var(--border); border-radius: 9px; padding: 11px 12px; background: rgba(15, 23, 42, 0.55); }
  .section-title {
    font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.04em; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
  }

  /* Primitive Item Cards */
  .item-card {
    border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 7px; padding: 8px 10px; margin-bottom: 6px; background: var(--surface);
  }
  .item-card[data-attempt-id]:hover { border-color: var(--border-strong); background: var(--surface-2); }
  .item-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 3px; }
  .prim-badge {
    font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .item-title { font-weight: 600; font-size: 12.5px; color: var(--text-bright); }
  .item-meta { font-size: 11px; color: var(--muted); margin-top: 3px; word-break: break-all; }
  .item-meta code { background: rgba(148, 163, 184, 0.14); padding: 1px 4px; border-radius: 4px; color: #cbd5e1; }
  .artifact-link {
    display: inline-block; background: rgba(59, 130, 246, 0.14); border: 1px solid rgba(59, 130, 246, 0.35);
    color: #93c5fd; text-decoration: none; padding: 1px 6px; border-radius: 4px; font-family: ui-monospace, monospace;
    font-size: 10.5px; transition: all 0.12s;
  }
  .artifact-link:hover { background: rgba(59, 130, 246, 0.28); color: #dbeafe; }
  .item-error {
    margin-top: 5px; padding: 6px 8px; border-radius: 5px;
    background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.3);
    color: #fca5a5; font-family: ui-monospace, monospace; font-size: 11px; white-space: pre-wrap;
  }

  /* Loop & Tree Blocks */
  .block-box {
    border: 1.5px solid var(--border-strong); border-radius: 8px;
    background: rgba(15, 23, 42, 0.65); padding: 9px 10px; margin-bottom: 8px;
  }
  .block-box.loop { border-color: rgba(59, 130, 246, 0.45); background: rgba(30, 58, 138, 0.14); }
  .block-box.tree { border-color: rgba(167, 139, 250, 0.45); background: rgba(76, 29, 149, 0.14); }
  .block-box.custom { border-color: rgba(236, 72, 153, 0.45); background: rgba(131, 24, 67, 0.14); }
  .block-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
  .block-kind {
    font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; text-transform: uppercase;
  }
  .block-kind.loop { background: rgba(59, 130, 246, 0.22); color: #93c5fd; }
  .block-kind.tree { background: rgba(167, 139, 250, 0.22); color: #c4b5fd; }
  .block-kind.custom { background: rgba(236, 72, 153, 0.22); color: #f9a8d4; }
  .iter-strip { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 4px 0 2px 0; font-size: 11px; }
  .iter-pill {
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 7px;
    font-size: 11.5px; font-weight: 600; border: 1px solid var(--border); background: var(--surface);
    color: var(--text); cursor: pointer; transition: all 0.14s;
  }
  .iter-pill:hover { border-color: var(--border-strong); background: var(--surface-2); color: var(--text-bright); }
  .iter-pill.active {
    border-color: rgba(59, 130, 246, 0.8); background: rgba(59, 130, 246, 0.2);
    color: var(--text-bright); box-shadow: 0 0 12px rgba(59, 130, 246, 0.22);
  }
  .iter-pill .iter-hint { font-size: 10.5px; color: var(--muted); font-weight: 500; }
  .iter-pill.active .iter-hint { color: #cbd5e1; }
  .expand-caret {
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--muted); margin-left: 2px;
    transition: transform 0.16s ease, color 0.16s ease;
  }
  .iter-pill:hover .expand-caret, .branch-tab:hover .expand-caret, .single-run-pill:hover .expand-caret { color: var(--text-bright); }
  .iter-pill.active .expand-caret, .branch-tab.active .expand-caret, .single-run-pill.active .expand-caret {
    transform: rotate(180deg); color: #93c5fd;
  }
  .single-run-pill {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 11px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all 0.14s;
  }
  .single-run-pill:hover { border-color: var(--border-strong); background: var(--surface-2); color: var(--text-bright); }
  .single-run-pill.active {
    border-color: rgba(59, 130, 246, 0.75); background: rgba(59, 130, 246, 0.16);
    color: var(--text-bright); box-shadow: 0 0 12px rgba(59, 130, 246, 0.18);
  }
  .single-run-left { display: inline-flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .single-run-right { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-weight: 500; }
  .iter-arrow { color: var(--muted); font-size: 10px; user-select: none; }
  .iter-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 8px 9px; margin-top: 7px; }
  .iter-panel-head { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .branch-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 8px 0; }
  .branch-tab {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 7px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    font-size: 11.5px; font-weight: 600; cursor: pointer; transition: all 0.14s;
  }
  .branch-tab:hover { border-color: var(--border-strong); background: var(--surface-2); }
  .branch-tab.active {
    border-color: rgba(167, 139, 250, 0.75); background: rgba(124, 58, 237, 0.2);
    color: var(--text-bright); box-shadow: 0 0 12px rgba(139, 92, 246, 0.2);
  }
  .branch-tab .br-metric { font-family: ui-monospace, monospace; font-size: 10.5px; color: var(--muted); }
  .branch-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 8px 9px; }

  /* Profiling Panel */
  .profiling-view { flex: 1; overflow-y: auto; padding: 20px 24px; max-width: 1100px; margin: 0 auto; width: 100%; }
  .profiling-view.hidden { display: none; }
  .bar-row { display: grid; grid-template-columns: 130px 1fr 100px; align-items: center; gap: 10px; margin-bottom: 8px; }
  .bar-track { height: 14px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; }
  .stack-bar { display: flex; height: 18px; border-radius: 6px; overflow: hidden; background: var(--surface-2); }
  .empty-state { padding: 48px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1 id="trace-title">Agent Tracing</h1>
    <span class="pill" id="meta-target"></span>
    <span class="pill" id="meta-counts"></span>
    <span class="pill best" id="meta-best" style="display:none"></span>
  </div>
  <div class="toolbar">
    <div class="tabs">
      <button id="tab-dag" class="active" onclick="switchView('dag')">全局 DAG</button>
      <button id="tab-prof" onclick="switchView('profiling')">阶段耗时汇总</button>
    </div>
    <button id="btn-layout" onclick="toggleLayoutDir()">布局: 树状 ↓</button>
    <button id="btn-best" onclick="toggleBestPath()">高亮最优路径</button>
    <button id="btn-code-edges" class="active" onclick="toggleCodeEdges()">代码沿用边</button>
    <select id="actor-filter" onchange="renderAll(); fitToView();" style="display:none"></select>
    <button onclick="fitToView()">适应画布</button>
    <button id="btn-live" onclick="toggleLive()" style="display:none">实时刷新: 开</button>
  </div>
</header>

<div class="main">
  <div id="dag-viewport" class="viewport">
    <div id="canvas-stage" class="canvas-stage">
      <svg id="edges-layer" class="edges-layer"></svg>
      <div id="nodes-layer"></div>
    </div>
    <div class="legend">
      <div class="legend-item"><span class="legend-line" style="background:#3b82f6"></span>受启发</div>
      <div class="legend-item"><span class="legend-line" style="background:#ef4444"></span>失败转向</div>
      <div class="legend-item"><span class="legend-line" style="background:#10b981"></span>吸收经验</div>
      <div class="legend-item"><span class="legend-line dashed"></span>代码沿用</div>
      <div class="legend-item">滚轮定点缩放 · 拖拽移动 · 双击聚焦 · Esc 取消</div>
    </div>
    <div class="zoom-hud">
      <button onclick="zoomBy(0.85)" title="缩小 (-)">−</button>
      <button id="zoom-pct" class="zoom-pct" onclick="resetZoom()" title="重置为 100%">100%</button>
      <button onclick="zoomBy(1.18)" title="放大 (+)">+</button>
      <button onclick="fitToView()" title="适应画布 (0)">⊡</button>
    </div>
  </div>

  <div id="profiling-view" class="profiling-view hidden"></div>

  <div id="drawer-resizer" class="drawer-resizer hidden" title="拖动调整边栏宽度"></div>
  <aside id="detail-drawer" class="drawer hidden">
    <div class="drawer-head">
      <div>
        <h2 id="drawer-title">Attempt</h2>
        <div id="drawer-sub" style="font-size:11px;color:var(--muted)"></div>
      </div>

  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmtDur(sec) {
  const s = Number(sec || 0);
  if (s <= 0) return '0s';
  if (s < 1) return Math.round(s * 1000) + 'ms';
  if (s < 60) return s.toFixed(1) + 's';
  const m = Math.floor(s / 60);
  const r = Math.round(s - m * 60);
  return m + 'm' + r + 's';
}

function fmtVal(v) {
  if (typeof v === 'number') return Number.isInteger(v) ? String(v) : Number(v.toPrecision(4)).toString();
  return String(v);
}

function statusClass(st) {
  return 'st-' + String(st || 'running').replace(/[^A-Za-z0-9_-]/g, '');
}

function phaseColor(phase) {
  return (DAG.global_profiling && DAG.global_profiling.phase_colors && DAG.global_profiling.phase_colors[phase]) || '#64748b';
}

const PHASE_LABELS = {
  analysis: '分析规划',
  edit: '编写修改',
  compile: '编译构建',
  wait_device: '等待设备',
  eval: '验证评测',
  simulate: '仿真模拟',
  profile: '性能剖析',
  unattributed: '未归类间隔',
};

function phaseLabel(phase) {
  return PHASE_LABELS[phase] || phase;
}

function catStyle(cat) {
  const raw = (DAG.categories && DAG.categories[cat]) || { label: cat, color: '#94a3b8', bg: '#1e293b', border: '#475569' };
  return {
    label: raw.label || cat,
    color: raw.color || '#94a3b8',
    bg: 'rgba(148, 163, 184, 0.12)',
    border: raw.color || '#475569',
  };
}

function visibleAttempts() {
  const actorSel = document.getElementById('actor-filter').value;
  return (DAG.attempts || []).filter(a => !actorSel || a.actor === actorSel);
}

function visibleEdges(attIds) {
  const set = new Set(attIds);
  return (DAG.edges || []).filter(e => {
    if (!set.has(e.source) || !set.has(e.target)) return false;
    if (!state.showCodeEdges && e.kind === 'code') return false;
    return true;
  });
}

function computeHighlightSet(edges) {
  if (state.highlightBest && DAG.best_path && DAG.best_path.length) {
    return new Set(DAG.best_path);
  }
  if (!state.selectedId) return null;
  const set = new Set([state.selectedId]);
  const edgeList = edges || DAG.edges || [];
  const up = [state.selectedId];
  while (up.length) {
    const cur = up.pop();
    for (const e of edgeList) {
      if (e.target === cur && !set.has(e.source)) { set.add(e.source); up.push(e.source); }
    }
  }
  const down = [state.selectedId];
  while (down.length) {
    const cur = down.pop();
    for (const e of edgeList) {
      if (e.source === cur && !set.has(e.target)) { set.add(e.target); down.push(e.target); }
    }
  }
  return set;
}

function renderHeader() {
  const meta = DAG.meta || {};
  document.getElementById('trace-title').textContent = meta.title || meta.trace_id || 'Agent Tracing';
  const targetEl = document.getElementById('meta-target');
  const targetTxt = [meta.operator, meta.target].filter(Boolean).join(' · ');
  targetEl.textContent = targetTxt || 'Kernel Optimization';
  targetEl.style.display = targetTxt ? 'inline-flex' : 'none';

  const gp = DAG.global_profiling || {};
  document.getElementById('meta-counts').textContent =
    `${(DAG.attempts || []).length} 次尝试 · ${(DAG.edges || []).length} 条边 · 总耗时 ${fmtDur(gp.total_s || 0)}`;

  const bestEl = document.getElementById('meta-best');
  if (DAG.best_attempt_id) {
    bestEl.style.display = 'inline-flex';
    bestEl.textContent = `★ 最优: ${DAG.best_attempt_id}`;
  } else {
    bestEl.style.display = 'none';
  }

  const lbDir = document.getElementById('btn-layout');
  if (lbDir) lbDir.textContent = state.layoutDir === 'tb' ? '布局: 树状 ↓' : '布局: 横向 →';

  const actors = [...new Set((DAG.attempts || []).map(a => a.actor).filter(Boolean))];
  const sel = document.getElementById('actor-filter');
  if (actors.length > 1) {
    const cur = sel.value;
    sel.style.display = 'inline-block';
    sel.innerHTML = `<option value="">全部 Actor (${actors.length})</option>` +
      actors.map(a => `<option value="${esc(a)}" ${a === cur ? 'selected' : ''}>Actor: ${esc(a)}</option>`).join('');
  } else {
    sel.style.display = 'none';
  }

  if (LIVE_API) {
    const lb = document.getElementById('btn-live');
    lb.style.display = 'inline-block';
    lb.textContent = state.liveEnabled ? '实时刷新: 开' : '实时刷新: 关';
    lb.classList.toggle('active', state.liveEnabled);
  }
}

function computeTreeX(attempts, allEdges) {
  // Build a clean primary tree skeleton:
  // 1) Prefer code_from as the structural parent (so returning to an earlier code base
  //    like A2 -> A6 forms a clean sibling branch beside A3 -> A4 -> A5).
  // 2) Otherwise fall back to causal parent (preferring deepest / non-cycle parent).
  const idSet = new Set(attempts.map(a => a.id));
  const attOrder = Object.fromEntries(attempts.map((a, i) => [a.id, i]));
  const inEdges = {};
  for (const a of attempts) inEdges[a.id] = [];
  for (const e of allEdges) {
    if (idSet.has(e.source) && idSet.has(e.target) && e.source !== e.target) {
      inEdges[e.target].push(e);
    }
  }

  const treeParent = {};
  const treeChildren = {};
  for (const a of attempts) treeChildren[a.id] = [];

  function createsCycle(parentId, childId) {
    let cur = parentId;
    const seen = new Set();
    while (cur && !seen.has(cur)) {
      if (cur === childId) return true;
      seen.add(cur);
      cur = treeParent[cur];
    }
    return false;
  }

  for (const a of attempts) {
    const incoming = inEdges[a.id] || [];
    if (!incoming.length) continue;
    // Prefer code_from first, then motivated_by/derived_from/absorbed, then pivoted_from.
    const score = e => {
      if (e.kind === 'code') return 0;
      if (e.type === 'motivated_by' || e.type === 'derived_from') return 1;
      if (e.type === 'absorbed') return 2;
      return 3;
    };
    const sorted = [...incoming].sort((x, y) => {
      const sd = score(x) - score(y);
      if (sd !== 0) return sd;
      // For absorbed/multi-parent, prefer the later/deeper parent so merge sits below branches.
      return (attOrder[y.source] || 0) - (attOrder[x.source] || 0);
    });
    for (const cand of sorted) {
      if (!createsCycle(cand.source, a.id)) {
        treeParent[a.id] = cand.source;
        treeChildren[cand.source].push(a.id);
        break;
      }
    }
  }

  // Sort children deterministically by attempt order.
  for (const id of Object.keys(treeChildren)) {
    treeChildren[id].sort((x, y) => (attOrder[x] || 0) - (attOrder[y] || 0));
  }

  const roots = attempts.filter(a => !treeParent[a.id]).map(a => a.id);
  const depth = {};
  const subW = {};

  function measure(id, d) {
    depth[id] = d;
    const kids = treeChildren[id] || [];
    if (!kids.length) {
      subW[id] = NODE_W;
      return NODE_W;
    }
    let total = 0;
    for (let i = 0; i < kids.length; i++) {
      if (i > 0) total += TREE_H_GAP;
      total += measure(kids[i], d + 1);
    }
    subW[id] = Math.max(NODE_W, total);
    return subW[id];
  }

  for (const r of roots) measure(r, 0);
  // Ensure any disconnected/cycle nodes still have depth & width.
  for (const a of attempts) {
    if (depth[a.id] == null) {
      depth[a.id] = (a.layout && a.layout.layer) || 0;
      subW[a.id] = NODE_W;
      roots.push(a.id);
    }
  }

  // Push multi-parent merge nodes (e.g. absorbed) below all their causal parents,
  // and propagate the depth increase down their tree descendants so a child is never placed above its parent.
  function pushSubtreeDepth(nodeId, minDepth, seen) {
    if (seen.has(nodeId)) return;
    seen.add(nodeId);
    if ((depth[nodeId] || 0) < minDepth) {
      depth[nodeId] = minDepth;
    }
    for (const cid of (treeChildren[nodeId] || [])) {
      pushSubtreeDepth(cid, depth[nodeId] + 1, seen);
    }
  }
  for (let pass = 0; pass < 4; pass++) {
    let changed = false;
    for (const e of allEdges) {
      if (e.kind === 'code' || e.type === 'pivoted_from') continue;
      if (depth[e.source] != null && depth[e.target] != null && treeParent[e.target] !== e.source) {
        if (depth[e.target] <= depth[e.source]) {
          pushSubtreeDepth(e.target, depth[e.source] + 1, new Set());
          changed = true;
        }
      }
    }
    if (!changed) break;
  }

  // Top-down symmetric placement: each parent centered cleanly over its subtree.
  const xLeft = {};
  function place(id, left) {
    const w = subW[id] || NODE_W;
    xLeft[id] = Math.round(left + (w - NODE_W) / 2);
    const kids = treeChildren[id] || [];
    if (!kids.length) return;
    let kidsTotal = 0;
    for (let i = 0; i < kids.length; i++) {
      if (i > 0) kidsTotal += TREE_H_GAP;
      kidsTotal += subW[kids[i]] || NODE_W;
    }
    let cursor = left + (w - kidsTotal) / 2;
    for (const cid of kids) {
      place(cid, cursor);
      cursor += (subW[cid] || NODE_W) + TREE_H_GAP;
    }
  }

  let rootCursor = 0;
  for (let i = 0; i < roots.length; i++) {
    if (i > 0) rootCursor += Math.round(TREE_H_GAP * 1.35);
    place(roots[i], rootCursor);
    rootCursor += subW[roots[i]] || NODE_W;
  }

  return { xLeft, depth, treeParent, treeChildren };
}

function roundedOrthogonalPath(pts, radius) {
  // Remove consecutive duplicates & collinear intermediate points.
  const clean = [];
  for (const pt of pts) {
    if (!clean.length || Math.hypot(pt[0] - clean[clean.length - 1][0], pt[1] - clean[clean.length - 1][1]) > 0.5) {
      clean.push(pt);
    }
  }
  const simp = [];
  for (let i = 0; i < clean.length; i++) {
    if (i > 0 && i < clean.length - 1) {
      const a = simp[simp.length - 1], b = clean[i], c = clean[i + 1];
      if ((Math.abs(a[0] - b[0]) < 0.5 && Math.abs(b[0] - c[0]) < 0.5) ||
          (Math.abs(a[1] - b[1]) < 0.5 && Math.abs(b[1] - c[1]) < 0.5)) {
        continue;
      }
    }
    simp.push(clean[i]);
  }
  if (simp.length < 2) return '';
  let d = `M ${simp[0][0]} ${simp[0][1]}`;
  for (let i = 1; i < simp.length - 1; i++) {
    const prev = simp[i - 1], cur = simp[i], next = simp[i + 1];
    const v1x = cur[0] - prev[0], v1y = cur[1] - prev[1];
    const v2x = next[0] - cur[0], v2y = next[1] - cur[1];
    const len1 = Math.hypot(v1x, v1y), len2 = Math.hypot(v2x, v2y);
    const r = Math.min(radius, len1 / 2, len2 / 2);
    const sx = cur[0] - (v1x / len1) * r, sy = cur[1] - (v1y / len1) * r;
    const ex = cur[0] + (v2x / len2) * r, ey = cur[1] + (v2y / len2) * r;
    d += ` L ${sx.toFixed(1)} ${sy.toFixed(1)} Q ${cur[0].toFixed(1)} ${cur[1].toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`;
  }
  const last = simp[simp.length - 1];
  d += ` L ${last[0].toFixed(1)} ${last[1].toFixed(1)}`;
  return d;
}

function mergeParallelEdges(edges) {
  // Collapse causal + code_from between the exact same (source, target) pair into one
  // clean primary wire with a combined label so wires never collide.
  const byPair = new Map();
  for (const e of edges) {
    const k = e.source + '->' + e.target;
    if (!byPair.has(k)) byPair.set(k, []);
    byPair.get(k).push(e);
  }
  const merged = [];
  for (const list of byPair.values()) {
    if (list.length === 1) {
      merged.push(list[0]);
      continue;
    }
    const causal = list.filter(e => e.kind !== 'code');
    const code = list.filter(e => e.kind === 'code');
    if (causal.length === 1 && code.length >= 1) {
      const primary = Object.assign({}, causal[0]);
      primary.label = (primary.label || primary.type) + ' · 代码';
      const reasons = [primary.reason, ...code.map(c => c.reason)].filter(Boolean);
      primary.reason = [...new Set(reasons)].join(' | ');
      primary.hasCode = true;
      merged.push(primary);
    } else {
      for (const e of list) merged.push(e);
    }
  }
  return merged;
}

function renderDag() {
  const nodesLayer = document.getElementById('nodes-layer');
  const edgesSvg = document.getElementById('edges-layer');
  const attempts = visibleAttempts();
  if (!attempts.length) {
    nodesLayer.innerHTML = '<div class="empty-state">暂无 Attempt 记录。</div>';
    edgesSvg.innerHTML = '';
    return;
  }

  const attIds = attempts.map(a => a.id);
  const attIdSet = new Set(attIds);
  const allVisibleNodeEdges = (DAG.edges || []).filter(e => attIdSet.has(e.source) && attIdSet.has(e.target));
  const rawVisEdges = visibleEdges(attIds);
  const edges = mergeParallelEdges(rawVisEdges);
  const hl = computeHighlightSet(rawVisEdges);

  const isTB = state.layoutDir === 'tb';
  const treeInfo = isTB ? computeTreeX(attempts, allVisibleNodeEdges) : null;

  const byLayer = {};
  for (const att of attempts) {
    const lk = isTB ? Number(treeInfo.depth[att.id] || 0) : Number((att.layout || {}).layer || 0);
    if (!byLayer[lk]) byLayer[lk] = [];
    byLayer[lk].push(att);
  }
  const layerKeys = Object.keys(byLayer).map(Number).sort((a, b) => a - b);
  for (const lk of layerKeys) {
    if (isTB) {
      byLayer[lk].sort((a, b) => (treeInfo.xLeft[a.id] || 0) - (treeInfo.xLeft[b.id] || 0));
    } else {
      byLayer[lk].sort((a, b) => ((a.layout || {}).order || 0) - ((b.layout || {}).order || 0));
    }
  }

  // Pass 1: render cards with provisional coordinates to measure real rendered heights.
  const pos = {};
  const multiActor = new Set(attempts.map(a => a.actor)).size > 1;
  nodesLayer.innerHTML = attempts.map(att => {
    const lay = att.layout || { layer: 0, order: 0 };
    const x = isTB ? (treeInfo.xLeft[att.id] || 0) : lay.layer * (NODE_W + COL_GAP);
    const y = isTB ? (treeInfo.depth[att.id] || 0) * (NODE_H + TREE_V_GAP) : lay.order * (NODE_H + ROW_GAP);
    pos[att.id] = { x, y, h: NODE_H };
    const st = att.status || 'running';
    const stats = att.stats || {};
    const isBest = att.id === DAG.best_attempt_id;
    const isSel = att.id === state.selectedId;
    const isDim = hl && !hl.has(att.id);
    const metrics = Object.entries(att.metrics || {}).slice(0, 3)
      .map(([k, v]) => `<span class="metric-chip">${esc(k)}: ${esc(fmtVal(v))}</span>`).join('');
    const phaseEntries = Object.entries(att.phase_summary || {});
    const pTotal = phaseEntries.reduce((s, [, v]) => s + v, 0) || 1;
    const strip = phaseEntries.map(([k, v]) =>
      `<div class="phase-seg" style="width:${(v / pTotal) * 100}%;background:${phaseColor(k)}" title="${esc(k)}: ${fmtDur(v)}"></div>`
    ).join('');
    const actorTag = multiActor ? `<span class="pill" style="font-size:10px;padding:0 5px">${esc(att.actor)}</span>` : '';
    const ports = isTB
      ? '<span class="node-port port-in-tb"></span><span class="node-port port-out-tb"></span><span class="node-port port-in-lr"></span><span class="node-port port-out-lr"></span>'
      : '<span class="node-port port-in-lr"></span><span class="node-port port-out-lr"></span>';
    return `<div class="node-card ${isSel ? 'selected' : ''} ${isBest ? 'best-node' : ''} ${isDim ? 'dimmed' : ''}"
      style="left:${x}px;top:${y}px" data-attempt-id="${esc(att.id)}">
      ${ports}
      <div class="node-head">
        <span class="node-id">${isBest ? '★ ' : ''}${esc(att.id)} ${actorTag}</span>
        <span class="status-badge ${statusClass(st)}">${esc(st)}</span>
      </div>
      <div class="node-title">${esc(att.title)}</div>
      <div class="metric-row">${metrics || '<span style="font-size:11px;color:var(--muted)">暂无指标</span>'}</div>
      <div class="node-foot">
        <span>编译 ${stats.compile_count || 0} 次 · 动作 ${stats.action_count || 0}</span>
        <span>${fmtDur(stats.total_duration_s || 0)}</span>
      </div>
      <div class="phase-strip">${strip}</div>
    </div>`;
  }).join('');

  // Pass 2: measure real card heights and stack cumulatively without overlaps.
  const cardsById = {};
  nodesLayer.querySelectorAll('.node-card').forEach(el => {
    const id = el.getAttribute('data-attempt-id');
    if (id == null) return;
    cardsById[id] = el;
    const measured = el.offsetHeight || NODE_H;
    if (pos[id]) pos[id].h = measured;
  });

  let maxX = 800, maxY = 500;
  let minX = Infinity, minY = Infinity, boundMaxX = -Infinity, boundMaxY = -Infinity;

  if (isTB) {
    let cursorY = 0;
    for (const lk of layerKeys) {
      let rowMaxH = NODE_H;
      for (const att of byLayer[lk]) {
        const p = pos[att.id];
        if (!p) continue;
        p.y = cursorY;
        rowMaxH = Math.max(rowMaxH, p.h);
        if (cardsById[att.id]) {
          cardsById[att.id].style.left = p.x + 'px';
          cardsById[att.id].style.top = p.y + 'px';
        }
        minX = Math.min(minX, p.x);
        minY = Math.min(minY, p.y);
        boundMaxX = Math.max(boundMaxX, p.x + NODE_W);
        boundMaxY = Math.max(boundMaxY, p.y + p.h);
        maxX = Math.max(maxX, p.x + NODE_W + 140);
        maxY = Math.max(maxY, p.y + p.h + 140);
      }
      cursorY += rowMaxH + TREE_V_GAP;
    }
  } else {
    for (const lk of layerKeys) {
      let cursorY = 0;
      for (const att of byLayer[lk]) {
        const p = pos[att.id];
        if (!p) continue;
        p.y = cursorY;
        cursorY += p.h + ROW_GAP;
        if (cardsById[att.id]) cardsById[att.id].style.top = p.y + 'px';
        minX = Math.min(minX, p.x);
        minY = Math.min(minY, p.y);
        boundMaxX = Math.max(boundMaxX, p.x + NODE_W);
        boundMaxY = Math.max(boundMaxY, p.y + p.h);
        maxX = Math.max(maxX, p.x + NODE_W + 140);
        maxY = Math.max(maxY, p.y + p.h + 140);
      }
    }
  }

  // Pass 3: PCB-style orthogonal circuit routing (clean vertical spine + side-channel bypasses).
  edgesSvg.setAttribute('width', maxX);
  edgesSvg.setAttribute('height', maxY);
  const defs = `
    <defs>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#3b82f6"/></marker>
      <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#ef4444"/></marker>
      <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#10b981"/></marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#94a3b8"/></marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#a78bfa"/></marker>
    </defs>`;

  function brightColor(c) {
    if (c === '#dc2626') return '#ef4444';
    if (c === '#059669') return '#10b981';
    if (c === '#64748b') return '#94a3b8';
    if (c === '#7c3aed') return '#a78bfa';
    return '#3b82f6';
  }

  function markerFor(color) {
    if (color === '#ef4444' || color === '#dc2626') return 'url(#arr-red)';
    if (color === '#10b981' || color === '#059669') return 'url(#arr-green)';
    if (color === '#94a3b8' || color === '#64748b') return 'url(#arr-slate)';
    if (color === '#a78bfa' || color === '#7c3aed') return 'url(#arr-purple)';
    return 'url(#arr-blue)';
  }

  // Check if a vertical segment at x between yA and yB intersects any other card.
  function verticalChannelClear(x, yA, yB, ignoreA, ignoreB) {
    const lo = Math.min(yA, yB) - 6;
    const hi = Math.max(yA, yB) + 6;
    for (const [id, p] of Object.entries(pos)) {
      if (id === ignoreA || id === ignoreB) continue;
      if (x >= p.x - 10 && x <= p.x + NODE_W + 10 && p.y + p.h >= lo && p.y <= hi) {
        return false;
      }
    }
    return true;
  }

  const pairCounts = {};
  const pairSeen = {};
  for (const e of edges) {
    const pk = e.source + '->' + e.target;
    pairCounts[pk] = (pairCounts[pk] || 0) + 1;
  }

  let leftLane = 0;
  let rightLane = 0;
  let innerChannelSlot = 0;
  const gMinX = isFinite(minX) ? minX : 0;
  const gMaxX = isFinite(boundMaxX) ? boundMaxX : maxX;
  let routeMinX = gMinX;
  let routeMaxX = gMaxX;

  let svgHtml = defs;
  edges.forEach((e) => {
    const p1 = pos[e.source], p2 = pos[e.target];
    if (!p1 || !p2) return;
    const pk = e.source + '->' + e.target;
    const totalSame = pairCounts[pk] || 1;
    const slot = pairSeen[pk] || 0;
    pairSeen[pk] = slot + 1;
    const spread = totalSame > 1 ? (slot - (totalSame - 1) / 2) * 20 : 0;

    let d = '', lx = 0, ly = 0;
    if (isTB) {
      const isSpine = treeInfo && treeInfo.treeParent[e.target] === e.source && p2.y > p1.y;
      if (isSpine) {
        // Primary top-to-bottom orthogonal tree bus (one clean line down the middle).
        const x1 = p1.x + NODE_W / 2 + spread;
        const y1 = p1.y + p1.h;
        const x2 = p2.x + NODE_W / 2 + spread;
        const y2 = p2.y;
        const busY = y1 + Math.min(TREE_V_GAP * 0.44, (y2 - y1) * 0.44);
        d = roundedOrthogonalPath([[x1, y1], [x1, busY], [x2, busY], [x2, y2]], 9);
        lx = x2;
        ly = busY + (y2 - busY) * 0.5;
      } else {
        // Cross-branch / skip-layer / pivot bypass: route cleanly via side ports & clear vertical corridor.
        const y1 = p1.y + p1.h / 2 + spread;
        const y2 = p2.y + p2.h / 2 + spread;
        const p2RightOfP1 = p2.x >= p1.x + NODE_W + 24;
        const p2LeftOfP1 = p1.x >= p2.x + NODE_W + 24;
        const midChanRight = p1.x + NODE_W + (p2.x - (p1.x + NODE_W)) / 2;
        const midChanLeft = p2.x + NODE_W + (p1.x - (p2.x + NODE_W)) / 2;

        if (p2RightOfP1 && verticalChannelClear(midChanRight, y1, y2, e.source, e.target)) {
          const cx = midChanRight + (innerChannelSlot++ % 3 - 1) * 10;
          d = roundedOrthogonalPath([
            [p1.x + NODE_W, y1], [cx, y1], [cx, y2], [p2.x, y2],
          ], 10);
          lx = cx;
          ly = (y1 + y2) / 2;
        } else if (p2LeftOfP1 && verticalChannelClear(midChanLeft, y1, y2, e.source, e.target)) {
          const cx = midChanLeft + (innerChannelSlot++ % 3 - 1) * 10;
          d = roundedOrthogonalPath([
            [p1.x, y1], [cx, y1], [cx, y2], [p2.x + NODE_W, y2],
          ], 10);
          lx = cx;
          ly = (y1 + y2) / 2;
        } else if (e.kind === 'code') {
          // Route code_from bypass along dedicated left outer gutter track.
          const gx = gMinX - 42 - (leftLane++) * 26;
          routeMinX = Math.min(routeMinX, gx - 30);
          d = roundedOrthogonalPath([
            [p1.x, y1], [gx, y1], [gx, y2], [p2.x, y2],
          ], 10);
          lx = gx;
          ly = (y1 + y2) / 2;
        } else {
          // Route causal bypass (e.g., pivot/absorb) along dedicated right outer gutter track.
          const gx = gMaxX + 42 + (rightLane++) * 26;
          routeMaxX = Math.max(routeMaxX, gx + 40);
          d = roundedOrthogonalPath([
            [p1.x + NODE_W, y1], [gx, y1], [gx, y2], [p2.x + NODE_W, y2],
          ], 10);
          lx = gx;
          ly = (y1 + y2) / 2;
        }
      }
    } else {
      const x1 = p1.x + NODE_W;
      const y1 = p1.y + p1.h / 2 + spread;
      const x2 = p2.x;
      const y2 = p2.y + p2.h / 2 + spread;
      const midX = (x1 + x2) / 2;
      d = roundedOrthogonalPath([[x1, y1], [midX, y1], [midX, y2], [x2, y2]], 9);
      lx = midX;
      ly = (y1 + y2) / 2;
    }

    const strokeCol = brightColor(e.color);
    const dimmed = hl && (!hl.has(e.source) || !hl.has(e.target));
    const dash = e.style === 'dashed' ? 'stroke-dasharray="6,4"' : '';
    const opacity = dimmed ? 0.14 : 0.94;
    const labelText = e.label || e.type || '';
    const pillW = Math.max(46, Math.min(132, labelText.length * 10 + 18));
    const pillH = 19;
    const tipHead = esc(`${e.source} → ${e.target} · ${labelText}`);
    const tipBody = esc(e.reason || '');
    svgHtml += `<g class="edge-group" opacity="${opacity}" style="color:${strokeCol}">
      <path class="edge-hit" d="${d}" fill="none" stroke="transparent" stroke-width="16" data-tip-head="${tipHead}" data-tip-body="${tipBody}"></path>
      <path class="edge-line" d="${d}" fill="none" stroke="${strokeCol}" stroke-width="${dimmed ? 1.5 : 2.3}" ${dash} marker-end="${markerFor(strokeCol)}"></path>
      <rect class="edge-pill-bg" x="${(lx - pillW / 2).toFixed(1)}" y="${(ly - pillH / 2).toFixed(1)}" width="${pillW}" height="${pillH}" rx="5" stroke="${strokeCol}" stroke-opacity="0.55"></rect>
      <text class="edge-label" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle">${esc(labelText)}</text>
    </g>`;
  });
  edgesSvg.innerHTML = svgHtml;

  state.nodePos = pos;
  state.bounds = {
    minX: routeMinX,
    minY: isFinite(minY) ? minY : 0,
    maxX: routeMaxX,
    maxY: isFinite(boundMaxY) ? boundMaxY : maxY,
  };

  applyTransform();
}

function artifactHref(snapshotName) {
  if (!snapshotName || /[\/\\]|\.\./.test(snapshotName)) return null;
  const encoded = encodeURIComponent(snapshotName);
  return LIVE_API ? `/artifacts/${encoded}` : `artifacts/${encoded}`;
}

function renderItemCard(it) {
  const cs = catStyle(it.category);
  const metrics = Object.entries(it.metrics || {})
    .map(([k, v]) => `<span class="metric-chip">${esc(k)}=${esc(fmtVal(v))}</span>`).join(' ');
  const dur = it.duration_s != null ? `<span class="pill">${fmtDur(it.duration_s)}</span>` : '';
  const target = it.target ? `<div class="item-meta">目标/命令: <code>${esc(it.target)}</code></div>` : '';
  const detail = it.detail ? `<div class="item-meta">${esc(it.detail)}</div>` : '';
  const err = it.error ? `<div class="item-error">${esc(it.error)}</div>` : '';
  const arts = (it.artifacts || []).length
    ? `<div class="item-meta">产物: ${(it.artifacts || []).map(a => {
        const href = a && a.snapshot ? artifactHref(a.snapshot) : null;
        const lbl = esc(a.label || a.path);
        return href ? `<a class="artifact-link" href="${esc(href)}" target="_blank" rel="noopener">${lbl} ↗</a>` : `<code>${lbl}</code>`;
      }).join(' ')}</div>`
    : '';
  return `<div class="item-card" style="border-left-color:${cs.color}">
    <div class="item-top">
      <span class="prim-badge" style="background:${cs.bg};color:${cs.color};border:1px solid ${cs.border}">${esc(it.primitive_label || it.primitive)}</span>
      <div style="display:flex;gap:4px;align-items:center">${dur}<span class="status-badge ${statusClass(it.status)}">${esc(it.status || 'ok')}</span></div>
    </div>
    <div class="item-title">${esc(it.title)}</div>
    ${target}${detail}
    ${metrics ? `<div class="metric-row" style="margin-top:5px;margin-bottom:0">${metrics}</div>` : ''}
    ${arts}${err}
  </div>`;
}

function renderDrawer() {
  const drawer = document.getElementById('detail-drawer');
  const resizer = document.getElementById('drawer-resizer');
  const att = (DAG.attempts || []).find(a => a.id === state.selectedId);
  if (!att) {
    drawer.classList.add('hidden');
    if (resizer) resizer.classList.add('hidden');
    return;
  }
  drawer.classList.remove('hidden');
  if (resizer) resizer.classList.remove('hidden');
  drawer.style.width = state.drawerWidth + 'px';

  document.getElementById('drawer-title').textContent = `${att.id}: ${att.title}`;
  const git = att.git || {};
  const gitTxt = git.commit ? ` · git ${git.commit.slice(0, 8)}${git.dirty ? ' (dirty)' : ''}` : '';
  document.getElementById('drawer-sub').textContent =
    `状态: ${att.status} · Actor: ${att.actor} · 总耗时: ${fmtDur((att.stats || {}).total_duration_s || 0)}${gitTxt}`;

  ['flow', 'buckets', 'timing', 'links'].forEach(t => {
    document.getElementById('dtab-' + t).classList.toggle('active', state.drawerTab === t);
  });

  const body = document.getElementById('drawer-body');
  const itemLookup = Object.fromEntries((att.items || []).map(it => [it.id, it]));

  if (state.drawerTab === 'flow') {
    let html = '';
    if (att.hypothesis || att.summary || att.abandon_reason) {
      html += `<div class="section">
        <div class="section-title">摘要与假设</div>
        ${att.hypothesis ? `<div><b>假设:</b> ${esc(att.hypothesis)}</div>` : ''}
        ${att.summary ? `<div style="margin-top:4px"><b>结论:</b> ${esc(att.summary)}</div>` : ''}
        ${att.abandon_reason ? `<div style="margin-top:4px;color:var(--fail)"><b>放弃原因:</b> ${esc(att.abandon_reason)}</div>` : ''}
      </div>`;
    }

    const blocks = att.blocks || [];
    const blockById = Object.fromEntries(blocks.map(b => [b.id, b]));
    const childrenByParent = {};
    for (const blk of blocks) {
      const pid = blk.parent_block_id;
      if (pid && blockById[pid]) {
        if (!childrenByParent[pid]) childrenByParent[pid] = [];
        childrenByParent[pid].push(blk);
      }
    }
    const topBlocks = blocks.filter(blk => !blk.parent_block_id || !blockById[blk.parent_block_id]);

    function topAncestor(blk) {
      let cur = blk;
      const seen = new Set();
      while (cur && cur.parent_block_id && blockById[cur.parent_block_id] && !seen.has(cur.id)) {
        seen.add(cur.id);
        cur = blockById[cur.parent_block_id];
      }
      return cur || blk;
    }

    const groupedIds = new Set();
    const topBlockByItem = {};
    for (const blk of blocks) {
      const topId = topAncestor(blk).id;
      const ids = new Set(blk.item_ids || []);
      for (const iter of (blk.iterations || [])) {
        for (const id of (iter.item_ids || [])) ids.add(id);
      }
      for (const br of (blk.branches || [])) {
        for (const id of (br.item_ids || [])) ids.add(id);
      }
      for (const id of ids) {
        groupedIds.add(id);
        topBlockByItem[id] = topId;
      }
    }

    function renderStepGroupPill(groupKey, groupItems, label) {
      const isOpen = Boolean(state.activeSingleRun[groupKey]);
      const failCount = groupItems.filter(x => ['fail', 'failed', 'error'].includes(String(x.status || '').toLowerCase())).length;
      const lastResult = [...groupItems].reverse().find(x => x.kind === 'result' && x.status);
      const itemStatuses = groupItems.map(x => String(x.status || '').toLowerCase()).filter(Boolean);
      const groupStatus = lastResult
        ? lastResult.status
        : (failCount > 0 ? 'failed' : (itemStatuses.length ? itemStatuses[itemStatuses.length - 1] : 'ok'));
      const lastMetricItem = [...groupItems].reverse().find(x => x.metrics && Object.keys(x.metrics).length);
      let hint = `${groupItems.length}步`;
      if (groupStatus === 'failed') {
        hint = `${groupItems.length}步 · 点击查看失败`;
      } else if (failCount > 0) {
        hint = `${groupItems.length}步 · 含${failCount}次失败重试`;
      } else if (lastMetricItem) {
        const [mk, mv] = Object.entries(lastMetricItem.metrics)[0];
        hint = `${groupItems.length}步 · ${mk}=${fmtVal(mv)}`;
      }
      const panel = isOpen
        ? `<div class="iter-panel"><div class="iter-panel-head"><span>${esc(label)} · ${groupItems.length} 项操作</span><span>点击上方胶囊收起</span></div>${groupItems.map(renderItemCard).join('')}</div>`
        : '';
      return `<div style="margin-bottom:8px"><button type="button" class="single-run-pill ${isOpen ? 'active' : ''}" data-single-run="${esc(groupKey)}" title="点击展开/收起步骤详情">
        <span class="single-run-left"><span>${esc(label)}</span><span class="status-badge ${statusClass(groupStatus)}">${esc(groupStatus)}</span></span>
        <span class="single-run-right"><span>${esc(hint)}</span><span class="expand-caret">▾</span></span>
      </button>${panel}</div>`;
    }

    const renderedBlocks = new Set();
    let flowHtml = '';
    const allItems = att.items || [];
    let ungroupedRun = [];
    let groupIdx = 0;

    function flushUngrouped() {
      if (!ungroupedRun.length) return;
      groupIdx += 1;
      const gKey = `${att.id}::grp::${groupIdx}`;
      const label = (!blocks.length && groupIdx === 1) ? '单次执行' : (ungroupedRun.length === 1 ? (ungroupedRun[0].primitive_label || '独立步骤') : '连续步骤');
      if (ungroupedRun.length === 1 && blocks.length > 0) {
        flowHtml += renderItemCard(ungroupedRun[0]);
      } else {
        flowHtml += renderStepGroupPill(gKey, ungroupedRun, label);
      }
      ungroupedRun = [];
    }

    for (const it of allItems) {
      if (groupedIds.has(it.id)) {
        flushUngrouped();
        const topId = topBlockByItem[it.id];
        const blk = blockById[topId];
        if (blk && !renderedBlocks.has(blk.id)) {
          renderedBlocks.add(blk.id);
          flowHtml += renderBlock(blk, itemLookup, childrenByParent);
        }
      } else {
        ungroupedRun.push(it);
      }
    }
    flushUngrouped();

    for (const blk of topBlocks) {
      if (renderedBlocks.has(blk.id)) continue;
      renderedBlocks.add(blk.id);
      flowHtml += renderBlock(blk, itemLookup, childrenByParent);
    }
    html += `<div class="section"><div class="section-title"><span>执行步骤</span><span>${allItems.length} 项</span></div>${flowHtml || '<div style="color:var(--muted)">暂无内部记录</div>'}</div>`;
    body.innerHTML = html;
  } else if (state.drawerTab === 'buckets') {
    const buckets = att.category_buckets || {};
    const keys = Object.keys(buckets);
    if (!keys.length) {
      body.innerHTML = '<div class="empty-state">暂无原子操作记录</div>';
      return;
    }
    body.innerHTML = keys.map(cat => {
      const cs = catStyle(cat);
      const cards = buckets[cat].map(id => itemLookup[id]).filter(Boolean).map(renderItemCard).join('');
      return `<div class="section" style="border-color:${cs.border}">
        <div class="section-title" style="color:${cs.color}"><span>${esc(cs.label)}</span><span>${buckets[cat].length}</span></div>
        ${cards}
      </div>`;
    }).join('');
  } else if (state.drawerTab === 'timing') {
    const ps = Object.entries(att.phase_summary || {}).sort((a, b) => b[1] - a[1]);
    const total = ps.reduce((s, [, v]) => s + v, 0) || 1;
    const bars = ps.map(([k, v]) => `
      <div class="bar-row" title="${esc(k)}">
        <span style="font-weight:600">${esc(phaseLabel(k))}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${(v / total) * 100}%;background:${phaseColor(k)}"></div></div>
        <span style="text-align:right;font-family:monospace">${fmtDur(v)} (${((v / total) * 100).toFixed(0)}%)</span>
      </div>`).join('');
    const tl = (att.timeline || []).map(sp => `
      <div class="item-card" style="border-left-color:${sp.color}">
        <div class="item-top"><span style="font-weight:700" title="${esc(sp.phase)}">${esc(phaseLabel(sp.phase))}</span><div style="display:flex;gap:4px;align-items:center">${sp.open ? '<span class="pill">进行中</span>' : ''}<span class="pill">${fmtDur(sp.duration_s)}</span></div></div>
        <div class="item-meta">${esc(sp.label)} (${esc(sp.source)})</div>
      </div>`).join('');
    body.innerHTML = `
      <div class="section"><div class="section-title"><span>阶段耗时分布</span><span>总计 ${fmtDur((att.stats || {}).total_duration_s || 0)}</span></div>${bars || '<div style="color:var(--muted)">暂无阶段计时数据</div>'}</div>
      <div class="section"><div class="section-title">计时时间线</div>${tl || '<div style="color:var(--muted)">暂无时间线事件</div>'}</div>`;
  } else if (state.drawerTab === 'links') {
    const incoming = (DAG.edges || []).filter(e => e.target === att.id);
    const outgoing = (DAG.edges || []).filter(e => e.source === att.id);
    const fmtEdge = (e, dir) => {
      const other = dir === 'in' ? e.source : e.target;
      const otherAtt = (DAG.attempts || []).find(a => a.id === other);
      return `<div class="item-card" style="border-left-color:${e.color};cursor:pointer" data-attempt-id="${esc(other)}">
        <div class="item-top"><b>${esc(other)}: ${esc(otherAtt ? otherAtt.title : '')}</b><span class="pill">${esc(e.label || e.type)}</span></div>
        ${e.reason ? `<div class="item-meta">${esc(e.reason)}</div>` : ''}
      </div>`;
    };
    body.innerHTML = `
      <div class="section"><div class="section-title">上游来源 (${incoming.length})</div>${incoming.map(e => fmtEdge(e, 'in')).join('') || '<div style="color:var(--muted)">独立尝试（无上游依赖）</div>'}</div>
      <div class="section"><div class="section-title">促成的后续尝试 (${outgoing.length})</div>${outgoing.map(e => fmtEdge(e, 'out')).join('') || '<div style="color:var(--muted)">暂无后续衍生</div>'}</div>`;
  }
}

function blockHasRecords(blk, childrenByParent, visited) {
  if (!blk) return false;
  const seen = visited || new Set();
  if (seen.has(blk.id)) return false;
  seen.add(blk.id);
  if ((blk.item_ids || []).length) return true;
  for (const iter of (blk.iterations || [])) {
    if ((iter.item_ids || []).length) return true;
  }
  for (const br of (blk.branches || [])) {
    if ((br.item_ids || []).length) return true;
  }
  const childMap = childrenByParent || {};
  return (childMap[blk.id] || []).some(child => blockHasRecords(child, childMap, seen));
}

function renderBlock(blk, itemLookup, childrenByParent, visited) {
  if (!blk) return '';
  const seen = visited || new Set();
  if (seen.has(blk.id)) return '';
  seen.add(blk.id);
  const childMap = childrenByParent || {};
  const childBlocks = (childMap[blk.id] || []).filter(c => !seen.has(c.id));
  const rawKind = String(blk.kind || 'loop').toLowerCase();
  const styleKind = rawKind === 'tree' ? 'tree' : (rawKind === 'loop' ? 'loop' : 'custom');
  const autoTag = blk.auto_grouped
    ? '<span class="pill" title="连续的修改/编译/验证步骤已自动按轮次折叠">自动折叠</span>'
    : '';
  let inner = '';
  if (rawKind === 'loop' && blk.iterations && blk.iterations.length) {
    const total = blk.iterations.length;
    const activeIter = state.activeLoopIter[blk.id] != null ? Number(state.activeLoopIter[blk.id]) : null;
    const strip = blk.iterations.map((it, idx) => {
      const itItems = (it.item_ids || []).map(id => itemLookup[id]).filter(Boolean);
      const failCount = itItems.filter(x => ['fail', 'failed', 'error'].includes(String(x.status || '').toLowerCase())).length;
      const lastMetricItem = [...itItems].reverse().find(x => x.metrics && Object.keys(x.metrics).length);
      let hint = `${itItems.length}步`;
      if (it.status === 'failed') {
        hint = `${itItems.length}步 · 点击查看失败`;
      } else if (failCount > 0) {
        hint = `${itItems.length}步 · 含${failCount}次失败重试`;
      } else if (lastMetricItem) {
        const [mk, mv] = Object.entries(lastMetricItem.metrics)[0];
        hint = `${itItems.length}步 · ${mk}=${fmtVal(mv)}`;
      }
      const isAct = activeIter === Number(it.iteration) ? 'active' : '';
      return `<button type="button" class="iter-pill ${isAct}" data-loop-block="${esc(blk.id)}" data-loop-iter="${esc(it.iteration)}" title="点击展开/收起第 ${esc(it.iteration)} 轮详情">
        <span>R${esc(it.iteration)}</span>
        <span class="status-badge ${statusClass(it.status)}">${esc(it.status)}</span>
        <span class="iter-hint">${esc(hint)}</span>
        <span class="expand-caret">▾</span>
      </button>` + (idx < total - 1 ? '<span class="iter-arrow">→</span>' : '');
    }).join('');
    let panel = '';
    if (activeIter != null) {
      const chosen = blk.iterations.find(it => Number(it.iteration) === activeIter);
      if (chosen) {
        const cards = (chosen.item_ids || []).map(id => itemLookup[id]).filter(Boolean).map(renderItemCard).join('');
        panel = `<div class="iter-panel">
          <div class="iter-panel-head"><span>第 ${esc(chosen.iteration)} 轮 · ${(chosen.item_ids || []).length} 项操作</span><span>再次点击 R${esc(chosen.iteration)} 收起</span></div>
          ${cards || '<div style="color:var(--muted)">该轮暂无记录</div>'}
        </div>`;
      }
    }
    inner = `<div class="iter-strip">${strip}</div>${panel}`;
  } else if (rawKind === 'tree' && blk.branches && blk.branches.length) {
    const branches = blk.branches;
    const activeName = state.activeTreeBranch[blk.id] || null;
    const tabBtns = branches.map(br => {
      const brItems = (br.item_ids || []).map(id => itemLookup[id]).filter(Boolean);
      const firstMetricEntry = brItems.flatMap(it => Object.entries(it.metrics || {}))[0];
      const metricTag = firstMetricEntry
        ? `<span class="br-metric">${esc(firstMetricEntry[0])}=${esc(fmtVal(firstMetricEntry[1]))}</span>`
        : '';
      const isAct = br.branch === activeName ? 'active' : '';
      return `<button type="button" class="branch-tab ${isAct}" data-tree-block="${esc(blk.id)}" data-tree-branch="${esc(br.branch)}" title="点击展开/收起分支详情">
        <span>${esc(br.branch)}</span>
        <span class="status-badge ${statusClass(br.status)}">${esc(br.status)}</span>
        ${metricTag}
        <span class="expand-caret">▾</span>
      </button>`;
    }).join('');
    let panel = '';
    if (activeName) {
      const activeBr = branches.find(b => b.branch === activeName);
      if (activeBr) {
        const activeCards = (activeBr.item_ids || []).map(id => itemLookup[id]).filter(Boolean).map(renderItemCard).join('');
        panel = `<div class="branch-panel">${activeCards || '<div style="color:var(--muted)">该分支暂无记录</div>'}</div>`;
      }
    }
    inner = `<div class="branch-tabs">${tabBtns}</div>${panel}`;
  } else {
    inner = (blk.item_ids || []).map(id => itemLookup[id]).filter(Boolean).map(renderItemCard).join('');
  }
  if (!blockHasRecords(blk, childMap, new Set())) {
    inner = '<div style="color:var(--muted);padding:4px 0">暂无记录</div>';
  }
  if (childBlocks.length) {
    inner += childBlocks.map(child => renderBlock(child, itemLookup, childMap, seen)).join('');
  }
  return `<div class="block-box ${styleKind}" data-block-id="${esc(blk.id)}">
    <div class="block-head">
      <div><span class="block-kind ${styleKind}">${esc(blk.kind)}</span> <b style="margin-left:4px;color:var(--text-bright)">${esc(blk.title)}</b></div>
      ${autoTag}
    </div>
    ${blk.summary ? `<div class="item-meta" style="margin-bottom:5px">${esc(blk.summary)}</div>` : ''}
    ${inner}
  </div>`;
}

function renderProfiling() {
  const el = document.getElementById('profiling-view');
  const gp = DAG.global_profiling || {};
  const entries = Object.entries(gp.by_phase || {});
  const total = gp.total_s || 1;
  const globalBars = entries.map(([k, v]) => `
    <div class="bar-row" title="${esc(k)}">
      <span style="font-weight:600">${esc(phaseLabel(k))}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${(v / total) * 100}%;background:${phaseColor(k)}"></div></div>
      <span style="text-align:right;font-family:monospace">${fmtDur(v)} (${((v / total) * 100).toFixed(1)}%)</span>
    </div>`).join('');

  const maxAttDur = Math.max(0.01, ...(DAG.attempts || []).map(a => (a.stats || {}).total_duration_s || 0));
  const perAttempt = (DAG.attempts || []).map(att => {
    const dur = (att.stats || {}).total_duration_s || 0;
    const segs = Object.entries(att.phase_summary || {}).map(([k, v]) =>
      `<div style="width:${(v / maxAttDur) * 100}%;background:${phaseColor(k)}" title="${esc(k)}: ${fmtDur(v)}"></div>`
    ).join('');
    return `<div style="margin-bottom:10px;cursor:pointer" data-attempt-id="${esc(att.id)}" data-switch-dag="1">
      <div style="display:flex;justify-content:space-between;margin-bottom:3px">
        <span><b>${esc(att.id)}</b>: ${esc(att.title)}</span>
        <span style="font-family:monospace">${fmtDur(dur)}</span>
      </div>
      <div class="stack-bar">${segs}</div>
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="section" style="margin-bottom:16px">
      <div class="section-title"><span>全局阶段耗时分布</span><span>总计 ${fmtDur(gp.total_s || 0)}</span></div>
      ${globalBars || '<div class="empty-state">暂无阶段计时数据</div>'}
    </div>
    <div class="section">
      <div class="section-title">各次尝试耗时对比（点击跳转至 DAG 节点）</div>
      ${perAttempt || '<div class="empty-state">暂无尝试记录</div>'}
    </div>`;
}

function selectAttempt(id) {
  state.selectedId = id;
  renderDag();
  renderDrawer();
}

function focusAttempt(id) {
  const p = state.nodePos && state.nodePos[id];
  const vpEl = document.getElementById('dag-viewport');
  if (!p || !vpEl) return;
  const vw = vpEl.clientWidth || 800;
  const vh = vpEl.clientHeight || 600;
  const targetScale = Math.max(state.scale, 1.0);
  state.scale = Math.min(1.4, targetScale);
  state.tx = vw / 2 - (p.x + NODE_W / 2) * state.scale;
  state.ty = vh / 2 - (p.y + p.h / 2) * state.scale;
  applyTransform();
}

function closeDrawer() {
  state.selectedId = null;
  renderDag();
  renderDrawer();
}

function switchView(v) {
  state.view = v;
  document.getElementById('tab-dag').classList.toggle('active', v === 'dag');
  document.getElementById('tab-prof').classList.toggle('active', v === 'profiling');
  document.getElementById('dag-viewport').style.display = v === 'dag' ? 'block' : 'none';
  document.getElementById('profiling-view').classList.toggle('hidden', v !== 'profiling');
  if (v === 'profiling') renderProfiling();
}

function switchDrawerTab(t) {
  state.drawerTab = t;
  renderDrawer();
}

function toggleLayoutDir() {
  state.layoutDir = state.layoutDir === 'tb' ? 'lr' : 'tb';
  renderHeader();
  renderDag();
  fitToView();
}

function toggleBestPath() {
  state.highlightBest = !state.highlightBest;
  document.getElementById('btn-best').classList.toggle('active', state.highlightBest);
  renderDag();
}

function toggleCodeEdges() {
  state.showCodeEdges = !state.showCodeEdges;
  document.getElementById('btn-code-edges').classList.toggle('active', state.showCodeEdges);
  renderDag();
}

function toggleLive() {
  state.liveEnabled = !state.liveEnabled;
  renderHeader();
}

function applyTransform() {
  const stage = document.getElementById('canvas-stage');
  if (stage) {
    stage.style.transform = `translate(${state.tx}px, ${state.ty}px) scale(${state.scale})`;
  }
  const vpEl = document.getElementById('dag-viewport');
  if (vpEl) {
    const step = Math.max(10, 24 * state.scale);
    vpEl.style.backgroundSize = `100% 100%, ${step}px ${step}px`;
    vpEl.style.backgroundPosition = `0 0, ${state.tx}px ${state.ty}px`;
  }
  const pct = document.getElementById('zoom-pct');
  if (pct) pct.textContent = Math.round(state.scale * 100) + '%';
}

function fitToView() {
  const vpEl = document.getElementById('dag-viewport');
  if (!vpEl) return;
  const vw = vpEl.clientWidth || 900;
  const vh = vpEl.clientHeight || 620;
  const b = state.bounds || { minX: 0, minY: 0, maxX: 800, maxY: 500 };
  const padX = 56, padY = 52;
  const gw = Math.max(1, b.maxX - b.minX);
  const gh = Math.max(1, b.maxY - b.minY);
  const s = Math.min(1.12, Math.max(0.25, Math.min((vw - padX * 2) / gw, (vh - padY * 2) / gh)));
  state.scale = s;
  state.tx = (vw - gw * s) / 2 - b.minX * s;
  state.ty = Math.max(32, (vh - gh * s) / 2 - b.minY * s);
  applyTransform();
}

function resetZoom() {
  const vpEl = document.getElementById('dag-viewport');
  const vw = (vpEl && vpEl.clientWidth) || 900;
  const b = state.bounds || { minX: 0, minY: 0, maxX: 800, maxY: 500 };
  const gw = Math.max(1, b.maxX - b.minX);
  state.scale = 1;
  state.tx = Math.max(40, (vw - gw) / 2 - b.minX);
  state.ty = 40 - b.minY;
  applyTransform();
}

function zoomAt(clientX, clientY, factor) {
  const vpEl = document.getElementById('dag-viewport');
  if (!vpEl) return;
  const rect = vpEl.getBoundingClientRect();
  const mx = clientX - rect.left;
  const my = clientY - rect.top;
  const nextScale = Math.min(2.5, Math.max(0.2, state.scale * factor));
  const worldX = (mx - state.tx) / state.scale;
  const worldY = (my - state.ty) / state.scale;
  state.scale = nextScale;
  state.tx = mx - worldX * nextScale;
  state.ty = my - worldY * nextScale;
  applyTransform();
}

function zoomBy(factor) {
  const vpEl = document.getElementById('dag-viewport');
  if (!vpEl) return;
  const rect = vpEl.getBoundingClientRect();
  zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, factor);
}

// Smooth Pan, Zoom-to-Cursor, Click-to-Deselect, and Middle/Space Panning
const vp = document.getElementById('dag-viewport');
vp.addEventListener('mousedown', e => {
  if (e.target.closest('.zoom-hud') || e.target.closest('.legend')) return;
  const isMiddle = e.button === 1;
  const isLeft = e.button === 0;
  if (!isMiddle && !isLeft) return;
  const onCard = Boolean(e.target.closest('.node-card'));
  if (onCard && !isMiddle && !state.spaceDown) return;
  if (isMiddle) e.preventDefault();
  state.panCandidate = true;
  state.dragging = false;
  state.dragMoved = false;
  state.dragStartClientX = e.clientX;
  state.dragStartClientY = e.clientY;
  state.dragOriginTx = state.tx;
  state.dragOriginTy = state.ty;
});

window.addEventListener('mousemove', e => {
  if (state.resizingDrawer) {
    const minW = 300;
    const maxW = Math.min(window.innerWidth * 0.78, 1080);
    const nextW = Math.round(Math.min(maxW, Math.max(minW, window.innerWidth - e.clientX)));
    state.drawerWidth = nextW;
    const drawer = document.getElementById('detail-drawer');
    if (drawer) drawer.style.width = nextW + 'px';
    return;
  }
  if (!state.panCandidate) return;
  const dx = e.clientX - state.dragStartClientX;
  const dy = e.clientY - state.dragStartClientY;
  if (!state.dragging && Math.hypot(dx, dy) >= 4) {
    state.dragging = true;
    state.dragMoved = true;
    vp.classList.add('dragging');
    document.body.classList.add('panning-canvas');
  }
  if (state.dragging) {
    state.tx = state.dragOriginTx + dx;
    state.ty = state.dragOriginTy + dy;
    applyTransform();
  }
});

window.addEventListener('mouseup', e => {
  if (state.resizingDrawer) {
    state.resizingDrawer = false;
    document.body.classList.remove('resizing-drawer');
    return;
  }
  if (state.panCandidate) {
    const wasMoved = state.dragMoved;
    const onCard = Boolean(e.target && e.target.closest && e.target.closest('.node-card'));
    const onHud = Boolean(e.target && e.target.closest && (e.target.closest('.zoom-hud') || e.target.closest('.legend')));
    state.panCandidate = false;
    state.dragging = false;
    state.dragMoved = false;
    vp.classList.remove('dragging');
    document.body.classList.remove('panning-canvas');
    // Plain click on empty canvas clears selection cleanly.
    if (!wasMoved && !onCard && !onHud && e.button === 0 && state.selectedId) {
      closeDrawer();
    }
  }
});

vp.addEventListener('wheel', e => {
  e.preventDefault();
  const intensity = e.ctrlKey ? 0.008 : 0.0014;
  const factor = Math.exp(-e.deltaY * intensity);
  zoomAt(e.clientX, e.clientY, factor);
}, { passive: false });

// Resizable Right Drawer Splitter
const resizerEl = document.getElementById('drawer-resizer');
if (resizerEl) {
  resizerEl.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    state.resizingDrawer = true;
    document.body.classList.add('resizing-drawer');
  });
}

// Custom Hover Tooltip for Edges
const edgeTipEl = document.getElementById('edge-tooltip');
document.getElementById('edges-layer').addEventListener('mousemove', e => {
  const hit = e.target.closest('.edge-hit');
  if (!hit || !edgeTipEl) {
    if (edgeTipEl) edgeTipEl.style.display = 'none';
    return;
  }
  const head = hit.getAttribute('data-tip-head') || '';
  const body = hit.getAttribute('data-tip-body') || '';
  edgeTipEl.innerHTML = `<div class="et-head">${esc(head)}</div>${body ? `<div>${esc(body)}</div>` : ''}`;
  edgeTipEl.style.display = 'block';
  edgeTipEl.style.left = Math.min(window.innerWidth - 360, e.clientX + 14) + 'px';
  edgeTipEl.style.top = Math.min(window.innerHeight - 90, e.clientY + 14) + 'px';
});
document.getElementById('edges-layer').addEventListener('mouseleave', () => {
  if (edgeTipEl) edgeTipEl.style.display = 'none';
});

// Keyboard shortcuts (+ / - / 0 / Esc / Space-pan)
window.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) return;
  if (e.code === 'Space') { state.spaceDown = true; vp.style.cursor = 'grab'; }
  else if (e.key === 'Escape' && state.selectedId) closeDrawer();
  else if (e.key === '=' || e.key === '+') zoomBy(1.15);
  else if (e.key === '-') zoomBy(0.87);
  else if (e.key === '0') fitToView();
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space') { state.spaceDown = false; vp.style.cursor = ''; }
});

// Delegated click & double-click handlers for attempt selection (avoids inline JS interpolation / XSS)
document.getElementById('nodes-layer').addEventListener('click', e => {
  if (state.spaceDown) return;
  const card = e.target.closest('[data-attempt-id]');
  if (card) selectAttempt(card.getAttribute('data-attempt-id'));
});
document.getElementById('nodes-layer').addEventListener('dblclick', e => {
  const card = e.target.closest('[data-attempt-id]');
  if (card) {
    const id = card.getAttribute('data-attempt-id');
    selectAttempt(id);
    focusAttempt(id);
  }
});
document.getElementById('drawer-body').addEventListener('click', e => {
  const srBtn = e.target.closest('[data-single-run]');
  if (srBtn) {
    const aid = srBtn.getAttribute('data-single-run');
    state.activeSingleRun[aid] = !state.activeSingleRun[aid];
    renderDrawer();
    return;
  }
  const lpBtn = e.target.closest('[data-loop-block]');
  if (lpBtn) {
    const bid = lpBtn.getAttribute('data-loop-block');
    const itNo = Number(lpBtn.getAttribute('data-loop-iter'));
    state.activeLoopIter[bid] = (state.activeLoopIter[bid] === itNo) ? null : itNo;
    renderDrawer();
    return;
  }
  const brBtn = e.target.closest('[data-tree-block]');
  if (brBtn) {
    const bid = brBtn.getAttribute('data-tree-block');
    const bname = brBtn.getAttribute('data-tree-branch');
    state.activeTreeBranch[bid] = (state.activeTreeBranch[bid] === bname) ? null : bname;
    renderDrawer();
    return;
  }
  const card = e.target.closest('[data-attempt-id]');
  if (card) {
    const id = card.getAttribute('data-attempt-id');
    selectAttempt(id);
    focusAttempt(id);
  }
});
document.getElementById('profiling-view').addEventListener('click', e => {
  const row = e.target.closest('[data-attempt-id]');
  if (row) {
    if (row.getAttribute('data-switch-dag') === '1') switchView('dag');
    const id = row.getAttribute('data-attempt-id');
    selectAttempt(id);
    focusAttempt(id);
  }
});

function renderAll() {
  renderHeader();
  renderDag();
  renderDrawer();
  if (state.view === 'profiling') renderProfiling();
}

function defaultSelectedAttemptId() {
  const attempts = DAG.attempts || [];
  if (!attempts.length) return null;
  if (DAG.best_attempt_id && attempts.some(a => a.id === DAG.best_attempt_id)) {
    return DAG.best_attempt_id;
  }
  return attempts[attempts.length - 1].id;
}

state.selectedId = defaultSelectedAttemptId();
renderAll();
fitToView();
if (typeof requestAnimationFrame === 'function') {
  requestAnimationFrame(() => fitToView());
}

if (LIVE_API) {
  setInterval(async () => {
    if (!state.liveEnabled) return;
    try {
      const res = await fetch(LIVE_API, { cache: 'no-store' });
      if (!res.ok) return;
      const fresh = await res.json();
      if (fresh.event_count !== DAG.event_count) {
        DAG = fresh;
        renderAll();
      }
    } catch (_) {}
  }, 2000);
}
</script>
</body>
